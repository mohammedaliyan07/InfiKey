name: Build InfiKey APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch llama.cpp
        run: bash app/src/main/cpp/fetch_llama_cpp.sh
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InfiKey-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InfiKey-debug-apk
          path: InfiKey-debug.apk

  # NOTE: the ~750 MB "bundled APK" variant (model packed into assets) was
  # removed — models are downloaded/imported on the device instead.

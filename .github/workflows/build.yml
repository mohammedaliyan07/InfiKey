name: Build InfiKey APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch llama.cpp
        run: bash app/src/main/cpp/fetch_llama_cpp.sh
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InfiKey-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InfiKey-debug-apk
          path: InfiKey-debug.apk

  bundled:
    name: APK with pre-installed model (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Fetch llama.cpp
        run: bash app/src/main/cpp/fetch_llama_cpp.sh
      - name: Download default model (LFM2.5-1.2B Q4_K_M)
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 3 -o app/src/main/assets/models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf \
            https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
      - name: Build bundled APK
        run: gradle assembleDebug --stacktrace --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk InfiKey-bundled.apk
      - uses: actions/upload-artifact@v4
        with:
          name: InfiKey-bundled-apk
          path: InfiKey-bundled.apk
